# Tendari — nginx server block
# Deploy: copy to /etc/nginx/sites-available/tendari.conf, symlink into
# sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# PHP backend: php-fpm (adjust the fastcgi_pass socket to your PHP version).

server {
    listen 80;
    listen [::]:80;
    server_name tendari.org www.tendari.org;

    # Document root MUST be public/ — storage/, config/, src/ stay outside it.
    root /var/www/tendari/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Static assets: let nginx serve them directly; no PHP round-trip.
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # PWA manifest MIME type without touching the global types map
    # (exact match wins over the ^~ /assets/ prefix above)
    location = /assets/favicon/site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location = /logo.svg {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Front controller: existing files first, then index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        # ADJUST to your PHP version / FPM socket:
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # fastcgi_pass unix:/run/php-fpm/www.sock;      # RHEL/CentOS layout
        # fastcgi_pass 127.0.0.1:9000;                  # TCP socket
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }

    # Block hidden files and backup/config leftovers.
    location ~ /\. {
        deny all;
    }

    # Optional security headers (HSTS only after HTTPS is confirmed working).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/tendari.access.log;
    error_log  /var/log/nginx/tendari.error.log;
}

# ---------------------------------------------------------------------------
# HTTPS — the site must present a certificate for tendari.org, not for the
# server's default host. Obtain one first:
#
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d tendari.org -d www.tendari.org
#
# certbot rewrites this file and adds the 443 block. If you manage it
# yourself, add this server block and redirect port 80 to HTTPS:
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name tendari.org www.tendari.org;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name tendari.org www.tendari.org;
#
#     root /var/www/tendari/public;
#     index index.php;
#
#     ssl_certificate     /etc/letsencrypt/live/tendari.org/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/tendari.org/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     # copy the charset/types/gzip/locations/PHP block from the server above
#     # add_header Strict-Transport-Security "max-age=31536000" always;  # after HTTPS works
# }
